<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novis Hosting | Free Minecraft Server</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #4caf50;
            --accent-hover: #45a049;
            --text-color: #ffffff;
            --text-muted: #aaaaaa;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 500px;
            width: 100%;
            border: 1px solid #333;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: var(--text-color);
        }

        h1 span {
            color: var(--accent-color);
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-bottom: 30px;
        }

        .specs-box {
            background-color: #151515;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            border-left: 4px solid var(--accent-color);
            text-align: left;
        }

        .specs-box p {
            margin: 8px 0;
            font-size: 1rem;
        }

        .specs-box strong {
            color: var(--accent-color);
        }

        .btn-dashboard {
            display: inline-block;
            background-color: var(--accent-color);
            color: white;
            text-decoration: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 6px;
            transition: all 0.2s ease-in-out;
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3);
            width: 100%;
        }

        .btn-dashboard:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(76, 175, 80, 0.5);
        }

        .btn-dashboard:active {
            transform: translateY(1px);
        }

        footer {
            margin-top: 20px;
            font-size: 0.8rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Novis<span>Hosting</span></h1>
        <p class="subtitle">Dein Gaming-Erlebnis startet hier</p>

        <div class="specs-box">
            <p><strong>Server-Typ:</strong> Minecraft Free Server</p>
            <p><strong>Arbeitsspeicher:</strong> 512 GB RAM</p>
            <p><strong>Verfügbarkeit:</strong> Online 24/7</p>
        </div>

        <a href="https://cautious-engine-6v9pwpg4vj65f45pw8080.github.dev" class="btn-dashboard">
            Zum Dashboard starten
        </a>
    </div>

    <footer>
        &copy; 2026 Novis Hosting. Alle Rechte vorbehalten.
    </footer>

</body>
</html>
