<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novis Hosting | Premium High-Performance Minecraft Servers</title>
    <style>
        :root {
            --bg-dark: #0b0c10;
            --card-bg: rgba(26, 26, 36, 0.75);
            --neon-green: #00ff66;
            --neon-green-glow: rgba(0, 255, 102, 0.4);
            --text-main: #ffffff;
            --text-secondary: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated Abstract Background for Pro Look */
        body::before {
            content: "";
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(0, 255, 102, 0.05) 0%, rgba(0,0,0,0) 70%);
            top: -10%;
            left: -10%;
            z-index: -1;
        }

        body::after {
            content: "";
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(0, 255, 102, 0.03) 0%, rgba(0,0,0,0) 70%);
            bottom: -10%;
            right: -10%;
            z-index: -1;
        }

        .hero-container {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 50px 40px;
            border-radius: 24px;
            border: 1px solid var(--border-color);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            text-align: center;
            max-width: 580px;
            width: 90%;
            z-index: 10;
        }

        /* Badge */
        .badge {
            display: inline-flex;
            align-items: center;
            background: rgba(0, 255, 102, 0.1);
            color: var(--neon-green);
            padding: 6px 14px;
            border-radius: 100px;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 24px;
            border: 1px solid rgba(0, 255, 102, 0.2);
        }

        .badge span {
            width: 8px;
            height: 8px;
            background-color: var(--neon-green);
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
            box-shadow: 0 0 8px var(--neon-green);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 255, 102, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(0, 255, 102, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 255, 102, 0); }
        }

        h1 {
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 12px;
            line-height: 1.1;
        }

        h1 span {
            color: var(--neon-green);
            text-shadow: 0 0 20px rgba(0, 255, 102, 0.2);
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1.15rem;
            line-height: 1.6;
            margin-bottom: 35px;
            font-weight: 400;
        }

        /* Pro Spec Grid Layout */
        .specs-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 35px;
        }

        .spec-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            padding: 16px;
            border-radius: 14px;
            text-align: left;
            transition: border 0.3s ease;
        }

        .spec-item:hover {
            border-color: rgba(0, 255, 102, 0.3);
        }

        .spec-label {
            color: var(--text-secondary);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .spec-value {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .spec-value.highlight {
            color: var(--neon-green);
        }

        /* Premium Call to Action Button */
        .btn-launch {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--neon-green);
            color: #000000;
            text-decoration: none;
            padding: 18px 32px;
            font-size: 1.2rem;
            font-weight: 700;
            border-radius: 14px;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 8px 24px var(--neon-green-glow);
            letter-spacing: -0.3px;
        }

        .btn-launch:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 32px rgba(0, 255, 102, 0.6);
            background-color: #1aff75;
        }

        .btn-launch:active {
            transform: translateY(-1px);
        }

        .btn-launch svg {
            margin-left: 10px;
            transition: transform 0.3s ease;
        }

        .btn-launch:hover svg {
            transform: translateX(4px);
        }

        footer {
            margin-top: 30px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="hero-container">
        <div class="badge">
            <span></span>Instance Ready
        </div>
        
        <h1>Novis<span>.</span></h1>
        <p class="subtitle">Next-generation high performance deployment. Deploy your own dedicated node instantly.</p>

        <div class="specs-grid">
            <div class="spec-item">
                <div class="spec-label">Server Type</div>
                <div class="spec-value">Minecraft Host</div>
            </div>
            <div class="spec-item">
                <div class="spec-label">Memory Allocated</div>
                <div class="spec-value highlight">512 GB RAM</div>
            </div>
            <div class="spec-item">
                <div class="spec-label">Uptime Guarantee</div>
                <div class="spec-value">24/7 / 99.9%</div>
            </div>
            <div class="spec-item">
                <div class="spec-label">Network Speed</div>
                <div class="spec-value">10 Gbps Port</div>
            </div>
        </div>

        <!-- Target Dashboard link correctly pointing to .github.dev -->
        <a href="https://cautious-engine-6v9pwpg4vj65f45pw8080.github.dev" class="btn-launch">
            Launch Dashboard
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </a>
    </div>

    <footer>
        &copy; 2026 Novis Hosting. Built for ultimate performance.
    </footer>

</body>
</html>
